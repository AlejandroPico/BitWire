name: Build portable desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui-app/src/**'
      - 'ui-app/desktop/**'
      - 'ui-app/package.json'
      - 'ui-app/package-lock.json'
      - 'ui-app/vite.config.ts'
      - 'catalog/**'
      - 'favicon.svg'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: bitwire-portable
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows portable
            command: npx electron-builder --win portable --x64 --arm64 --publish never
          - os: macos-latest
            label: macOS universal
            command: npx electron-builder --mac zip --universal --publish never
          - os: ubuntu-latest
            label: Linux AppImage
            command: npx electron-builder --linux AppImage --x64 --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ui-app
        run: npm ci
      - name: Compile component catalog
        run: python catalog/generate_db.py --output ui-app/public/catalog.db
      - name: Test
        working-directory: ui-app
        run: npm test
      - name: Build desktop frontend
        working-directory: ui-app
        run: npm run build:desktop
      - name: Package
        working-directory: ui-app
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: bitwire-${{ runner.os }}
          path: ui-app/release/BitWire-*
          if-no-files-found: error

  release:
    name: Publish portable downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Point desktop-latest to this revision
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/desktop-latest';
            try {
              await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref, sha: context.sha, force: true });
            } catch (error) {
              // GitHub currently answers 422 ("Reference does not exist")
              // when updating a missing tag; older API behaviour used 404.
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/${ref}`, sha: context.sha });
            }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: BitWire portable · última versión
          body: |
            Aplicaciones portables de BitWire generadas automáticamente desde `main`.

            - Windows: ejecutable `.exe` sin instalación.
            - macOS: aplicación universal para Intel y Apple Silicon.
            - Linux: AppImage autocontenida.

            Los tres paquetes incluyen la interfaz, el catálogo y el motor de simulación.
          make_latest: true
          files: downloads/BitWire-*
